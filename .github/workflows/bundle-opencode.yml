name: Bundle opencode

# Produces the embedded opencode assets (bundle.js, version.txt, package.json) and
# stages libnode.so per ABI, uploaded as the `opencode-bundle` workflow artifact.
#
# Triggers:
#   - push to main:    builds + uploads the artifact only (NEVER commits back).
#   - workflow_dispatch: manual rebuild.
#   - workflow_call:   invoked by release.yml as a prerequisite (needs: bundle).
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout OAgents
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install esbuild globally
        run: npm install -g esbuild

      - name: Checkout opencode source (sst/opencode, dev branch)
        uses: actions/checkout@v4
        with:
          repository: sst/opencode
          path: opencode-src
          ref: dev

      - name: Bundle opencode CLI
        # ASSUMPTION: the CLI entrypoint on the `dev` branch is
        #   packages/opencode/src/index.ts
        # If sst/opencode moves/renames the entry, update the path below. This step
        # is best-effort: on ANY failure (missing lockfile, moved entry, esbuild
        # error) it writes a placeholder bundle that throws on require() so the
        # artifact always ships and a missing bundle fails loudly at runtime.
        shell: bash
        run: |
          set +e
          (
            cd opencode-src
            npm ci
            npx esbuild packages/opencode/src/index.ts \
              --bundle \
              --platform=node \
              --format=cjs \
              --outfile=../opencode.bundle.js \
              --external:esbuild
          )
          code=$?
          if [ "$code" -ne 0 ] || [ ! -s opencode.bundle.js ]; then
            echo "::warning::opencode bundle failed (esbuild exit $code) or produced an empty file; writing a placeholder."
            cat > opencode.bundle.js <<'EOF'
          // Placeholder generated by .github/workflows/bundle-opencode.yml
          // The real opencode CLI bundle could not be produced in this run.
          // require('./opencode.bundle.js') is callable but throws immediately,
          // so a missing bundle fails loudly at runtime instead of silently.
          function opencodeBundleMissing() {
            throw new Error(
              'opencode bundle missing: this build was produced without a real opencode.bundle.js. ' +
              'Re-run the bundle-opencode workflow on main and update the artifact.'
            );
          }
          module.exports = opencodeBundleMissing;
          module.exports.default = opencodeBundleMissing;
          EOF
          fi
          exit 0

      - name: Write version.txt
        shell: bash
        run: |
          sha="$(git -C opencode-src rev-parse --short HEAD)"
          printf 'opencode-%s\n' "$sha" > version.txt
          echo "opencode version: $(cat version.txt)"

      - name: Stage JS bundle + metadata
        shell: bash
        run: |
          mkdir -p staging
          cp opencode.bundle.js staging/opencode.bundle.js
          cp version.txt staging/version.txt
          cp opencode-src/package.json staging/package.json

      - name: Fetch NodeJS Mobile per-ABI libs (best-effort)
        # HONEST LIMITATION: there is no single, stable, well-known per-ABI libnode.so
        # download URL we can rely on at build time. The nodejs-mobile-builder
        # releases (https://github.com/StefanoBelli/nodejs-mobile-builder/releases)
        # ship tarballs whose asset names/contents are not guaranteed. This step is
        # best-effort and intentionally defensive: if it yields no usable .so files,
        # the maintainer MUST drop libnode.so (arm64-v8a, armeabi-v7a, x86_64) into
        # node-mobile/<abi>/ (committed to the repo) before release builds will run
        # on-device. The artifact is still produced (JS-only) in that case.
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p node-mobile
          # Best-effort discovery of the latest nodejs-mobile-builder release.
          # Asset names are not guaranteed; replace this block with explicit
          # `curl -L -o node-mobile/<abi>.tar.gz <url> && tar -xzf ...` if a
          # reliable asset URL is known.
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/StefanoBelli/nodejs-mobile-builder/releases/latest" \
            -o release.json || true
          echo "Fetched nodejs-mobile-builder release metadata (best-effort)."

      - name: Stage libnode.so per ABI (whatever is present)
        shell: bash
        run: |
          mkdir -p staging/jniLibs
          found=0
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            src="node-mobile/${abi}/libnode.so"
            if [ -f "$src" ]; then
              mkdir -p "staging/jniLibs/${abi}"
              cp "$src" "staging/jniLibs/${abi}/libnode.so"
              found=$((found+1))
              echo "Staged libnode.so for ${abi}"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::No libnode.so found under node-mobile/<abi>/. The opencode-bundle artifact will contain only the JS bundle. A maintainer must provide libnode.so (arm64-v8a, armeabi-v7a, x86_64) before on-device builds will run."
          fi

      - name: Upload opencode-bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-bundle
          path: staging/
          if-no-files-found: error
          retention-days: 30
