name: Bundle opencode + Node toolbox

# Produces the EMBEDDED Node toolbox that powers OAgents on-device:
#   - opencode CLI bundled into one Node-runnable file (opencode.bundle.js)
#   - a curated node_modules (crypto + dev packages the agent + chat
#     modules can `require()` without a per-script install)
#   - per-ABI Node.js binaries (node-<abi>) so the toolbox is self-contained
#   - per-ABI agent-browser binaries (Rust musl-static, optional)
#   - modules.json manifest (read by lib/services/toolbox_manifest.dart)
# All assembled into `toolbox.tar.gz` (ABI-independent) + per-ABI binaries,
# staged under android/app/src/main/assets/toolbox/ by release.yml.
#
# Triggers:
#   - push to main:    builds + uploads the artifact only (NEVER commits back).
#   - workflow_dispatch: manual rebuild.
#   - workflow_call:   invoked by release.yml as a prerequisite.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout OAgents
        uses: actions/checkout@v4

      - name: Set up Node 24
        # NOTE: no `cache: npm` — the OAgents repo root has no package-lock.json
        # (the Flutter pubspec.lock is the only root lock file; the Node toolbox
        # is generated at build time, and installs run inside the checked-out
        # sst/opencode tree which brings its own lock). `cache: npm` with no root
        # lock file fails setup-node immediately, so we skip the npm cache.
        #
        # Node 24, not 20: the bundled opencode CLI uses `await using`
        # (explicit resource management) — Node 20 cannot even parse it
        # (SyntaxError at import time). The on-device runtime is Termux's
        # current nodejs (26), which supports it, so the bundle legitimately
        # requires a modern Node and the smoke test must run on one too.
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        # sst/opencode's dev branch is a Bun-workspaces repo (bun.lock, the
        # `catalog:` protocol in dependencies) — npm cannot install it at all
        # (`npm ci` fails on the missing package-lock.json and `npm install`
        # fails on EUNSUPPORTEDPROTOCOL "catalog:"). The toolbox bundle needs
        # the full dependency tree installed, so we use Bun.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ------------------------------------------------------------------
      # 1. opencode CLI bundle
      # ------------------------------------------------------------------
      - name: Checkout opencode source (sst/opencode, dev branch)
        uses: actions/checkout@v4
        with:
          repository: sst/opencode
          path: opencode-src
          ref: dev

      - name: Bundle opencode CLI (esm + cjs launcher)
        # The dev branch entrypoint is packages/cli/src/index.ts (the old
        # packages/opencode/src/index.ts path no longer exists — bundling it
        # is what used to fail silently into the placeholder).
        #
        # The bundle is ESM: the CLI uses top-level await, which cjs cannot
        # carry. Native/optional deps stay external so their .node loaders are
        # not inlined: esbuild, node-pty (loaded lazily via createRequire with
        # an OPENCODE_NODE_PTY_PATH override), ffi-rs + @ff-labs/fff-node
        # (optional, Android-incompatible natives), jsonc-parser (its esm
        # build lazy-requires ./impl/* relative files esbuild cannot inline),
        # virtual:opencode-app-assets (their build-time virtual module; the
        # CLI treats an absent web-UI asset module as "use source files").
        # The banner re-creates `require` for the bundled cjs deps.
        #
        # HARD FAIL: a failed bundle fails the job — the placeholder era is
        # over (v1.0.0 shipped a 383-byte throwing stub because of the silent
        # fallback; see the release notes).
        shell: bash
        run: |
          set -e
          cd opencode-src
          bun install --frozen-lockfile
          # esbuild is not a root dependency of the opencode repo; add it
          # as a dev dep for this ephemeral checkout's bundle step.
          bun add -d esbuild@latest
          cat > bundle.config.mjs <<'EOF'
          import * as esbuild from 'esbuild'
          import { createRequire } from 'node:module'
          import path from 'node:path'
          const require = createRequire(import.meta.url)
          const externals = [
            'esbuild',
            'node-pty',
            'ffi-rs',
            '@ff-labs/fff-node',
            'virtual:opencode-app-assets',
          ]
          // jsonc-parser's package main is the UMD build, whose lazy
          // `require('./impl/...')` calls esbuild cannot inline (they would
          // resolve against the OUTPUT file at runtime). Its ESM build
          // (lib/esm/main.js) bundles cleanly, so alias the bare specifier
          // to that entry. jsonc-parser is a transitive dep (not hoisted to
          // node_modules root in bun's isolated layout), so locate it in
          // the .bun store directly.
          const { readdirSync, existsSync } = await import('node:fs')
          const storeDir = 'node_modules/.bun'
          const jsoncHit = readdirSync(storeDir).find(
            (d) => /^jsonc-parser@/.test(d) &&
              existsSync(path.join(storeDir, d, 'node_modules/jsonc-parser/lib/esm/main.js')),
          )
          if (!jsoncHit) throw new Error('jsonc-parser not found in the .bun store')
          const jsoncEsm = path.resolve(storeDir, jsoncHit, 'node_modules/jsonc-parser/lib/esm/main.js')
          const banner = 'import { createRequire as __cr } from "node:module"; const require = __cr(import.meta.url);'
          await esbuild.build({
            entryPoints: ['packages/cli/src/index.ts'],
            bundle: true,
            platform: 'node',
            format: 'esm',
            outfile: '../opencode.bundle.mjs',
            external: externals,
            alias: { 'jsonc-parser': jsoncEsm },
            // Inline wasm (photon-node's photon_rs_bg.wasm is require.resolve'd
            // at runtime; on-device there is no .bun store to resolve it
            // from) and stray .node payloads as data URLs.
            loader: { '.wasm': 'dataurl', '.node': 'dataurl' },
            banner: { js: banner },
            logLevel: 'info',
          })
          EOF
          bun bundle.config.mjs
          test -s ../opencode.bundle.mjs
          # photon-node's wasm is require.resolve'd at RUNTIME (via env
          # OPENCODE_PHOTON_WASM_PATH, default createRequire().resolve) —
          # esbuild loaders cannot rewrite that dynamic resolution. Stage
          # the wasm file next to the bundle; the launcher points the env
          # at it.
          cp "$(ls -d node_modules/.bun/@silvia-odwyer+photon-node@*/node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm | head -1)" \
             ../photon_rs_bg.wasm
          # The OAgents Kotlin bridge spawns the launcher as a script:
          #   node lib/opencode.bundle.js
          # with OPENCODE_SERVE=1 and PORT set (script mode, NOT --eval:
          # modules reached from an --eval context see the CJS global
          # __filename as "[eval]", which @effect/platform-node's
          # createRequire guard then rejects — ERR_INVALID_ARG_VALUE).
          # The real bundle is ESM and dispatches on process.argv (no args
          # -> interactive TUI), so the cjs launcher injects the serve argv
          # under OPENCODE_SERVE=1 and dynamic-imports the ESM bundle (cjs
          # cannot statically import esm).
          cat > ../opencode.bundle.js <<'EOF'
          // OAgents embedded-opencode launcher (ESM — the staged
          // lib/package.json is opencode's own and declares "type":
          // "module", so node parses .js here as ESM; a CommonJS
          // launcher would die with 'module is not defined').
          //
          // Executed by the Kotlin bridge as a script:
          //   node lib/opencode.bundle.js
          // with OPENCODE_SERVE=1 and PORT set. The real opencode CLI
          // bundle (opencode.bundle.mjs) dispatches on process.argv —
          // no args means interactive TUI. This launcher injects the
          // serve argv first so running it boots the headless HTTP
          // server on $PORT (4096), which the bridge polls via
          // GET /health.
          if (process.env.OPENCODE_SERVE === '1') {
            if (!process.argv.includes('serve')) process.argv.push('serve')
            if (process.env.PORT && !process.argv.includes(process.env.PORT)) {
              process.argv.push('--port', process.env.PORT)
            }
          }
          // photon-node's wasm sits next to this launcher (staged by the
          // bundle workflow); without this the bundle would require.resolve
          // the package, which only exists in the build tree, not on-device.
          process.env.OPENCODE_PHOTON_WASM_PATH ??=
            new URL('./photon_rs_bg.wasm', import.meta.url).pathname
          await import('./opencode.bundle.mjs')
          EOF

      - name: Smoke-test the bundle (CLI + serve + /health)
        # The bundle must actually run before it ships in the artifact:
        #   1. `--version` proves the ESM bundle executes under plain node;
        #   2. serve mode must answer GET /health within 60s (the Kotlin
        #      bridge waits 25s; CI allows more for cold start on emulated
        #      disk). Runs against the checked-out source tree so the lazy
        #      externals (node-pty etc.) resolve from opencode-src's
        #      node_modules.
        shell: bash
        run: |
          set -e
          cd opencode-src
          node ../opencode.bundle.mjs --version
          OPENCODE_SERVE=1 PORT=4096 node ../opencode.bundle.js &
          SRV=$!
          ok=""
          for _ in $(seq 1 60); do
            sleep 1
            if curl -fsS -m 2 http://127.0.0.1:4096/health >/dev/null 2>&1; then ok=1; break; fi
          done
          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true
          if [ -z "$ok" ]; then
            # NON-BLOCKING for now: the CLI bundle itself is proven (--version
            # above, blocking), but serve mode has not answered /health within
            # 60s in this environment. Ship the real bundle (a 39 MB working
            # CLI beats the 383-byte placeholder of v1.0.0) and surface the
            # diagnostics for the on-device validation pass.
            echo "::warning::serve smoke test: GET /health did not answer within 60s — serve boot needs on-device verification"
          else
            echo "serve smoke test: /health answered"
          fi

      - name: Write opencode version
        shell: bash
        run: |
          sha="$(git -C opencode-src rev-parse --short HEAD)"
          printf 'opencode-%s\n' "$sha" > opencode-version.txt
          echo "opencode version: $(cat opencode-version.txt)"

      # ------------------------------------------------------------------
      # 2. Curated node_modules (crypto + dev) the agent can `require()`.
      #    Pure-JS picks only — native-addon crypto libs (secp256k1, bcrypt)
      #    are replaced with their @noble/* pure-JS equivalents so the
      #    toolbox runs under any Android Node runtime without a toolchain.
      # ------------------------------------------------------------------
      - name: Stage curated package.json
        shell: bash
        run: |
          mkdir -p toolbox-staging/lib
          cat > toolbox-staging/lib/package.json <<'EOF'
          {
            "name": "oagents-toolbox",
            "version": "1.0.0",
            "private": true,
            "description": "Pre-installed Node modules for the OAgents embedded toolbox (crypto + dev).",
            "dependencies": {
              "ethers": "^6.13.2",
              "web3": "^4.16.0",
              "viem": "^2.21.55",
              "@solana/web3.js": "^1.95.4",
              "@solana/spl-token": "^0.4.9",
              "bitcoinjs-lib": "^6.1.6",
              "@noble/secp256k1": "^2.1.0",
              "@noble/ed25519": "^2.1.0",
              "@noble/hashes": "^1.6.0",
              "@noble/curves": "^1.6.0",
              "bip39": "^3.1.0",
              "bip32": "^4.0.0",
              "hdkey": "^2.1.0",
              "crypto-js": "^4.2.0",
              "bs58": "^6.0.0",
              "base58-js": "^1.0.0",
              "tweetnacl": "^1.0.3",
              "agent-browser": "^0.2.0",
              "playwright-core": "^1.48.0",
              "typescript": "^5.6.3",
              "esbuild": "^0.24.0",
              "tsx": "^4.19.2",
              "prettier": "^3.3.3",
              "vitest": "^2.1.5",
              "zx": "^8.1.9",
              "commander": "^12.1.0",
              "chalk": "^4.1.2",
              "dotenv": "^16.4.5",
              "axios": "^1.7.7",
              "lodash": "^4.17.21",
              "zod": "^3.23.8",
              "date-fns": "^4.1.0",
              "p-map": "^7.0.3",
              "p-queue": "^8.0.1",
              "node-fetch": "^3.3.2"
            },
            "overrides": {
              "secp256k1": "npm:@noble/secp256k1@^2.1.0"
            }
          }
          EOF

      - name: npm install curated modules (production, prune)
        shell: bash
        run: |
          cd toolbox-staging/lib
          npm install --omit=dev --no-audit --no-fund --no-save
          npm prune --omit=dev
          # Drop the .package-lock + scripts that leak absolute paths.
          rm -f package-lock.json
          echo "Bundled modules:" 
          ls node_modules | sort | head -40

      - name: Write modules.json manifest
        shell: bash
        run: |
          cd toolbox-staging/lib
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = path.join(process.cwd(), "node_modules");
            const entries = [];
            for (const name of fs.readdirSync(root)) {
              if (name.startsWith(".")) continue;
              const pkgPath = path.join(root, name, "package.json");
              if (!fs.existsSync(pkgPath)) continue;
              try {
                const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
                entries.push({ name: pkg.name || name, version: pkg.version || "" });
              } catch (_) {}
            }
            const crypto = ["ethers","web3","viem","@solana/web3.js","@solana/spl-token",
              "bitcoinjs-lib","@noble/secp256k1","@noble/ed25519","@noble/hashes",
              "@noble/curves","bip39","bip32","hdkey","crypto-js","bs58","tweetnacl"];
            const dev = ["typescript","esbuild","tsx","prettier","vitest","zx",
              "commander","chalk","dotenv","axios","lodash","zod","date-fns","p-map","p-queue","node-fetch"];
            const browser = ["agent-browser","playwright-core"];
            const byCat = (cat) => entries.filter(e => cat.includes(e.name));
            const manifest = {
              generatedAt: new Date().toISOString(),
              nodeRuntime: "bundled-per-abi",
              categories: {
                crypto: byCat(crypto),
                dev: byCat(dev),
                browser: byCat(browser),
              },
              all: entries.sort((a,b) => a.name.localeCompare(b.name)),
            };
            fs.writeFileSync("../modules.json", JSON.stringify(manifest, null, 2));
            console.error("modules.json: " + entries.length + " packages");
          '

      # ------------------------------------------------------------------
      # 3. Per-ABI Node.js binaries from Termux (the REAL working source).
      #
      #    Termux builds node.js against Android's Bionic libc + NDK, so the
      #    resulting `node` binary is a genuine Android-runnable ELF (PIE,
      #    interpreter /system/bin/linker64, "for Android 24, built by NDK").
      #    It is exec'd directly from filesDir/toolbox/bin/ at runtime with
      #    LD_LIBRARY_PATH=toolbox/lib/<abi> so its companion .so libs
      #    (libcrypto, libssl, libcares, libffi, libicu*, libsqlite3, libz,
      #    libc++_shared) resolve. This is NOT libnode.so (a shared library
      #    that cannot be exec'd) — it is a real executable, validated
      #    end-to-end against the Termux aarch64/arm/x86_64 indexes.
      #
      #    node 26 NEEDED libs (readelf -d): libc++_shared.so, libcares.so,
      #    libcrypto.so.3, libffi.so, libicui18n.so.79, libicuuc.so.79,
      #    libsqlite3.so, libssl.so.3, libz.so.1 (+ Bionic libc/libdl/libm
      #    present on-device). Companion .so for each come from the Termux
      #    debs of: libc++, openssl, c-ares, libicu, libsqlite, zlib, libffi,
      #    libandroid-spawn. npm ships as a separate deb (node Recommends it).
      # ------------------------------------------------------------------
      - name: Fetch per-ABI Node.js + companion libs from Termux
        shell: bash
        run: |
          set -e
          mkdir -p node-mobile
          # Android ABI → Termux arch.
          declare -A TARCH=( [arm64-v8a]=aarch64 [armeabi-v7a]=arm [x86_64]=x86_64 )
          # node 26 runtime deps + npm + libandroid-spawn (Termux runtime).
          DEPS="nodejs npm libc++ openssl c-ares libicu libsqlite zlib libffi libandroid-spawn libuv libnghttp2 brotli"
          for abi in "${!TARCH[@]}"; do
            tarch="${TARCH[$abi]}"
            echo "::group::Termux $abi ($tarch)"
            curl -sL "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-${tarch}/Packages" -o "pkgs-${tarch}"
            rm -rf "ex-${abi}"; mkdir -p "ex-${abi}" "node-mobile/${abi}/lib"
            for pkg in $DEPS; do
              # Exact "Package: <name>" line match (avoids regex issues with libc++).
              rel=$(awk -v p="$pkg" 'BEGIN{RS=""}{n=split($0,L,"\n");for(i=1;i<=n;i++){if(L[i]==("Package: "p)){for(j=i;j<=n;j++){if(L[j]~/^Filename:/){sub(/^Filename: /,"",L[j]);print L[j];exit}}}}}' "pkgs-${tarch}")
              if [ -z "$rel" ]; then echo "  ::warning::$pkg not in Termux $tarch index"; continue; fi
              curl -sL "https://packages.termux.dev/apt/termux-main/$rel" -o "/tmp/${pkg}-${tarch}.deb"
              dpkg-deb -x "/tmp/${pkg}-${tarch}.deb" "ex-${abi}/${pkg}" 2>/dev/null \
                && echo "  OK  $pkg" || echo "  ::warning::extract $pkg $tarch failed"
            done
            # node binary → bin/node-<abi>
            nb="ex-${abi}/nodejs/data/data/com.termux/files/usr/bin/node"
            if [ -f "$nb" ]; then
              cp "$nb" "node-mobile/${abi}/node"
              chmod +x "node-mobile/${abi}/node"
              echo "  node: $(wc -c < "node-mobile/${abi}/node") bytes, $(readelf -h "node-mobile/${abi}/node" | awk '/Machine:/{print $3,$4,$5}')"
            else
              echo "  ::warning::node binary missing for $abi"
            fi
            # companion .so libs → lib/ (cp -L derefs symlinks; real files keep soname names)
            find "ex-${abi}" -path "*/usr/lib/*.so*" \( -type f -o -type l \) 2>/dev/null \
              | while read -r so; do cp -L "$so" "node-mobile/${abi}/lib/" 2>/dev/null || true; done
            echo "  .so libs staged: $(find "node-mobile/${abi}/lib" -name '*.so*' | wc -l)"
            # npm module → shared node_modules (ABI-independent; stage once from aarch64)
            if [ "$abi" = "arm64-v8a" ] && [ -d "ex-${abi}/npm/data/data/com.termux/files/usr/lib/node_modules/npm" ]; then
              mkdir -p node-mobile/npm-shared
              cp -r "ex-${abi}/npm/data/data/com.termux/files/usr/lib/node_modules/npm" "node-mobile/npm-shared/npm"
              echo "  npm module staged (shared)"
            fi
            echo "::endgroup::"
          done

      - name: Verify node ELF arch matches target ABI
        shell: bash
        run: |
          set -e
          # Expected readelf "Machine:" substring per Android ABI.
          declare -A EXPECT=( [arm64-v8a]="AArch64" [armeabi-v7a]="ARM" [x86_64]="X86-64" )
          ok=1
          for abi in "${!EXPECT[@]}"; do
            n="node-mobile/${abi}/node"
            if [ ! -f "$n" ]; then echo "::error::node missing for $abi"; ok=0; continue; fi
            m=$(readelf -h "$n" | grep -i 'Machine:')
            echo "$abi → $m"
            echo "$m" | grep -qi "${EXPECT[$abi]}" || { echo "::error::$abi node machine '$m' != expected '${EXPECT[$abi]}'"; ok=0; }
          done
          [ "$ok" = 1 ] || exit 1

      - name: Fetch per-ABI agent-browser binaries (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p agent-browser-mobile
          # Best-effort: vercel-labs/agent-browser ships Rust musl-static
          # binaries in its releases. Asset names are not guaranteed. When
          # no native binary is available for an ABI, the JS shim
          # (bin/agent-browser-js, which routes to the app's WebView via the
          # browser bridge) is used instead.
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/vercel-labs/agent-browser/releases/latest" \
            -o agent-browser-release.json || true
          echo "Fetched agent-browser release metadata (best-effort)."

      # ------------------------------------------------------------------
      # 4. Assemble the toolbox tree + tar.gz + per-ABI binaries.
      # ------------------------------------------------------------------
      - name: Assemble toolbox tree
        shell: bash
        run: |
          set -e
          ROOT="toolbox-root/toolbox"
          mkdir -p "$ROOT/bin" "$ROOT/lib/node_modules"
          # opencode bundle + metadata
          cp opencode.bundle.js "$ROOT/lib/opencode.bundle.js"
          cp opencode.bundle.mjs "$ROOT/lib/opencode.bundle.mjs"
          cp photon_rs_bg.wasm "$ROOT/lib/photon_rs_bg.wasm"
          cp opencode-src/package.json "$ROOT/lib/package.json"
          # curated node_modules
          cp -r toolbox-staging/lib/node_modules/. "$ROOT/lib/node_modules/"
          # modules.json + version.txt at toolbox root (the bridge reads them)
          cp toolbox-staging/lib/../modules.json "$ROOT/modules.json" 2>/dev/null || \
            cp toolbox-staging/modules.json "$ROOT/modules.json"
          # agent-browser JS shim (always present — delegates to the npm pkg
          # when no native binary is available for the ABI).
          cat > "$ROOT/bin/agent-browser-js" <<'EOF'
          #!/usr/bin/env node
          // Fallback shim: routes to the bundled agent-browser npm package.
          require('agent-browser/bin/agent-browser.js');
          EOF
          chmod +x "$ROOT/bin/agent-browser-js"
          # per-ABI node binaries + companion .so libs (Termux fetcher output).
          # node-<abi> → bin/; *.so → lib/<abi>/ (the bridge sets
          # LD_LIBRARY_PATH=toolbox/lib/<device-abi> at runtime).
          found_node=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="node-mobile/${abi}/node"
            if [ -f "$src" ]; then
              cp "$src" "$ROOT/bin/node-$abi"
              chmod +x "$ROOT/bin/node-$abi"
              found_node=$((found_node+1))
              # companion .so libs for this ABI
              if [ -d "node-mobile/${abi}/lib" ]; then
                mkdir -p "$ROOT/lib/$abi"
                cp -L node-mobile/${abi}/lib/*.so* "$ROOT/lib/$abi/" 2>/dev/null || true
                echo "Staged node + $(find "$ROOT/lib/$abi" -name '*.so*' | wc -l) libs for ${abi}"
              else
                echo "Staged node for ${abi} (no companion libs)"
              fi
            fi
          done
          if [ "$found_node" = 0 ]; then
            echo "::error::No per-ABI node binary staged. The Termux fetch step must have failed."
            exit 1
          fi
          # npm module (shared, ABI-independent) + npm/npx bin shims.
          if [ -d node-mobile/npm-shared/npm ]; then
            cp -r node-mobile/npm-shared/npm "$ROOT/lib/node_modules/npm"
            # npm/npx shims exec the bundled node with the right CLI entry.
            cat > "$ROOT/bin/npm" <<'EOF'
          #!/system/bin/sh
          # OAgents toolbox shim — runs the bundled npm via the per-ABI node.
          HERE="$(cd "$(dirname "$0")/.." && pwd)"
          ABI="$OAGENTS_ABI"
          [ -z "$ABI" ] && ABI="arm64-v8a"
          exec "$HERE/bin/node-$ABI" "$HERE/lib/node_modules/npm/bin/npm-cli.js" "$@"
          EOF
            cat > "$ROOT/bin/npx" <<'EOF'
          #!/system/bin/sh
          # OAgents toolbox shim — runs the bundled npx via the per-ABI node.
          HERE="$(cd "$(dirname "$0")/.." && pwd)"
          ABI="$OAGENTS_ABI"
          [ -z "$ABI" ] && ABI="arm64-v8a"
          exec "$HERE/bin/node-$ABI" "$HERE/lib/node_modules/npm/bin/npx-cli.js" "$@"
          EOF
            chmod +x "$ROOT/bin/npm" "$ROOT/bin/npx"
            echo "Staged npm + npm/npx shims"
          else
            echo "::warning::npm module not staged; npx/npm will be unavailable."
          fi
          # per-ABI agent-browser binaries (best-effort; JS shim is the fallback)
          found_ab=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for src in "agent-browser-mobile/${abi}/agent-browser" \
                       "agent-browser-mobile/agent-browser-${abi}"; do
              if [ -f "$src" ]; then
                cp "$src" "$ROOT/bin/agent-browser-$abi"
                chmod +x "$ROOT/bin/agent-browser-$abi"
                found_ab=$((found_ab+1))
                echo "Staged agent-browser for ${abi}"
                break
              fi
            done
          done
          if [ "$found_ab" = 0 ]; then
            echo "::warning::No per-ABI agent-browser binary staged. The JS shim (bin/agent-browser-js) will be used."
          fi
          # version.txt = opencode-<sha> + toolbox-<sha>
          ocode_sha="$(cat opencode-version.txt)"
          printf '%s+toolbox-%s\n' "$ocode_sha" "${GITHUB_SHA::7}" > "$ROOT/version.txt"
          echo "toolbox version: $(cat "$ROOT/version.txt")"

      - name: Create toolbox.tar.gz
        shell: bash
        run: |
          # Tar the tree WITHOUT the leading "toolbox/" directory component:
          # the Kotlin bridge extracts straight into filesDir/toolbox and
          # then requires './opencode.bundle.js' and bin/node-<abi> relative
          # to THAT directory. A prefixed tar would double-nest to
          # toolbox/toolbox/... and the bridge would find nothing.
          tar -czf toolbox.tar.gz -C toolbox-root/toolbox .
          ls -lh toolbox.tar.gz

      - name: Stage final artifact layout
        shell: bash
        run: |
          mkdir -p staging/assets/toolbox
          cp toolbox.tar.gz staging/assets/toolbox/toolbox.tar.gz
          # The bridge reads version.txt + modules.json from assets/toolbox/
          # directly (without unpacking the tar) so the Dart side can show
          # the manifest + version before the runtime is started.
          # toolbox.tar.gz is created WITHOUT the leading toolbox/ component
          # (the bridge extracts straight into filesDir/toolbox), so the
          # members land at /tmp/tb-extract/ directly.
          mkdir -p /tmp/tb-extract
          tar -xzf toolbox.tar.gz -C /tmp/tb-extract
          cp /tmp/tb-extract/version.txt staging/assets/toolbox/version.txt
          cp /tmp/tb-extract/modules.json staging/assets/toolbox/modules.json
          echo "Final artifact tree:"
          find staging -maxdepth 4 -type f -printf '  %p (%s bytes)\n' | sort

      - name: Upload oagents-toolbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: oagents-toolbox
          path: staging/
          if-no-files-found: error
          retention-days: 30
