name: Bundle opencode + Node toolbox

# Produces the EMBEDDED Node toolbox that powers OAgents on-device:
#   - opencode CLI bundled into one Node-runnable file (opencode.bundle.js)
#   - a curated node_modules (crypto + dev packages the agent + chat
#     modules can `require()` without a per-script install)
#   - per-ABI Node.js binaries (node-<abi>) so the toolbox is self-contained
#   - per-ABI agent-browser binaries (Rust musl-static, optional)
#   - modules.json manifest (read by lib/services/toolbox_manifest.dart)
# All assembled into `toolbox.tar.gz` (ABI-independent) + per-ABI binaries,
# staged under android/app/src/main/assets/toolbox/ by release.yml.
#
# Triggers:
#   - push to main:    builds + uploads the artifact only (NEVER commits back).
#   - workflow_dispatch: manual rebuild.
#   - workflow_call:   invoked by release.yml as a prerequisite.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout OAgents
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install esbuild globally
        run: npm install -g esbuild

      # ------------------------------------------------------------------
      # 1. opencode CLI bundle
      # ------------------------------------------------------------------
      - name: Checkout opencode source (sst/opencode, dev branch)
        uses: actions/checkout@v4
        with:
          repository: sst/opencode
          path: opencode-src
          ref: dev

      - name: Bundle opencode CLI
        # ASSUMPTION: the CLI entrypoint on the `dev` branch is
        #   packages/opencode/src/index.ts
        # If sst/opencode moves/renames the entry, update the path below.
        # Best-effort: on ANY failure it writes a placeholder bundle that
        # throws on require() so the artifact always ships and a missing
        # bundle fails loudly at runtime.
        shell: bash
        run: |
          set +e
          (
            cd opencode-src
            npm ci
            npx esbuild packages/opencode/src/index.ts \
              --bundle \
              --platform=node \
              --format=cjs \
              --outfile=../opencode.bundle.js \
              --external:esbuild
          )
          code=$?
          if [ "$code" -ne 0 ] || [ ! -s opencode.bundle.js ]; then
            echo "::warning::opencode bundle failed (esbuild exit $code) or produced an empty file; writing a placeholder."
            cat > opencode.bundle.js <<'EOF'
          // Placeholder generated by .github/workflows/bundle-opencode.yml
          function opencodeBundleMissing() {
            throw new Error(
              'opencode bundle missing: this build was produced without a real opencode.bundle.js. ' +
              'Re-run the bundle-opencode workflow on main and update the artifact.'
            );
          }
          module.exports = opencodeBundleMissing;
          module.exports.default = opencodeBundleMissing;
          EOF
          fi
          exit 0

      - name: Write opencode version
        shell: bash
        run: |
          sha="$(git -C opencode-src rev-parse --short HEAD)"
          printf 'opencode-%s\n' "$sha" > opencode-version.txt
          echo "opencode version: $(cat opencode-version.txt)"

      # ------------------------------------------------------------------
      # 2. Curated node_modules (crypto + dev) the agent can `require()`.
      #    Pure-JS picks only — native-addon crypto libs (secp256k1, bcrypt)
      #    are replaced with their @noble/* pure-JS equivalents so the
      #    toolbox runs under any Android Node runtime without a toolchain.
      # ------------------------------------------------------------------
      - name: Stage curated package.json
        shell: bash
        run: |
          mkdir -p toolbox-staging/lib
          cat > toolbox-staging/lib/package.json <<'EOF'
          {
            "name": "oagents-toolbox",
            "version": "1.0.0",
            "private": true,
            "description": "Pre-installed Node modules for the OAgents embedded toolbox (crypto + dev).",
            "dependencies": {
              "ethers": "^6.13.2",
              "web3": "^4.16.0",
              "viem": "^2.21.55",
              "@solana/web3.js": "^1.95.4",
              "@solana/spl-token": "^0.4.9",
              "bitcoinjs-lib": "^6.1.6",
              "@noble/secp256k1": "^2.1.0",
              "@noble/ed25519": "^2.1.0",
              "@noble/hashes": "^1.6.0",
              "@noble/curves": "^1.6.0",
              "bip39": "^3.1.0",
              "bip32": "^4.0.0",
              "hdkey": "^2.1.0",
              "crypto-js": "^4.2.0",
              "bs58": "^6.0.0",
              "base58-js": "^0.1.0",
              "tweetnacl": "^1.0.3",
              "agent-browser": "^0.2.0",
              "playwright-core": "^1.48.0",
              "typescript": "^5.6.3",
              "esbuild": "^0.24.0",
              "tsx": "^4.19.2",
              "prettier": "^3.3.3",
              "vitest": "^2.1.5",
              "zx": "^8.1.9",
              "commander": "^12.1.0",
              "chalk": "^4.1.2",
              "dotenv": "^16.4.5",
              "axios": "^1.7.7",
              "lodash": "^4.17.21",
              "zod": "^3.23.8",
              "date-fns": "^4.1.0",
              "p-map": "^7.0.3",
              "p-queue": "^8.0.1",
              "node-fetch": "^3.3.2"
            },
            "overrides": {
              "secp256k1": "npm:@noble/secp256k1@^2.1.0"
            }
          }
          EOF

      - name: npm install curated modules (production, prune)
        shell: bash
        run: |
          cd toolbox-staging/lib
          npm install --omit=dev --no-audit --no-fund --no-save
          npm prune --omit=dev
          # Drop the .package-lock + scripts that leak absolute paths.
          rm -f package-lock.json
          echo "Bundled modules:" 
          ls node_modules | sort | head -40

      - name: Write modules.json manifest
        shell: bash
        run: |
          cd toolbox-staging/lib
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = path.join(process.cwd(), "node_modules");
            const entries = [];
            for (const name of fs.readdirSync(root)) {
              if (name.startsWith(".")) continue;
              const pkgPath = path.join(root, name, "package.json");
              if (!fs.existsSync(pkgPath)) continue;
              try {
                const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
                entries.push({ name: pkg.name || name, version: pkg.version || "" });
              } catch (_) {}
            }
            const crypto = ["ethers","web3","viem","@solana/web3.js","@solana/spl-token",
              "bitcoinjs-lib","@noble/secp256k1","@noble/ed25519","@noble/hashes",
              "@noble/curves","bip39","bip32","hdkey","crypto-js","bs58","tweetnacl"];
            const dev = ["typescript","esbuild","tsx","prettier","vitest","zx",
              "commander","chalk","dotenv","axios","lodash","zod","date-fns","p-map","p-queue","node-fetch"];
            const browser = ["agent-browser","playwright-core"];
            const byCat = (cat) => entries.filter(e => cat.includes(e.name));
            const manifest = {
              generatedAt: new Date().toISOString(),
              nodeRuntime: "bundled-per-abi",
              categories: {
                crypto: byCat(crypto),
                dev: byCat(dev),
                browser: byCat(browser),
              },
              all: entries.sort((a,b) => a.name.localeCompare(b.name)),
            };
            fs.writeFileSync("../modules.json", JSON.stringify(manifest, null, 2));
            console.error("modules.json: " + entries.length + " packages");
          '

      # ------------------------------------------------------------------
      # 3. Per-ABI Node.js binaries + agent-browser binaries (best-effort).
      #    HONEST LIMITATION: there is no single well-known, stable URL for
      #    an Android-runnable per-ABI node binary. The step is best-effort
      #    and defensive: if it yields nothing, the maintainer MUST drop
      #      node-<abi>            into assets/toolbox/bin/
      #      (arm64-v8a / armeabi-v7a / x86_64)
      #    OR libnode.so into android/app/src/main/jniLibs/<abi>/ before
      #    release builds will run on-device. The artifact still ships
      #    (JS-only) in that case. Same for agent-browser-<abi>.
      # ------------------------------------------------------------------
      - name: Fetch per-ABI Node binaries (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p node-mobile
          # Best-effort: try Termux's node-static mirror + nodejs-mobile-builder.
          # Asset names/paths are NOT guaranteed — replace with explicit URLs
          # if a reliable source is known.
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/StefanoBelli/nodejs-mobile-builder/releases/latest" \
            -o nodejs-mobile-release.json || true
          echo "Fetched nodejs-mobile-builder release metadata (best-effort)."

      - name: Fetch per-ABI agent-browser binaries (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p agent-browser-mobile
          # Best-effort: vercel-labs/agent-browser ships Rust musl-static
          # binaries in its releases. Asset names are not guaranteed.
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/vercel-labs/agent-browser/releases/latest" \
            -o agent-browser-release.json || true
          echo "Fetched agent-browser release metadata (best-effort)."

      # ------------------------------------------------------------------
      # 4. Assemble the toolbox tree + tar.gz + per-ABI binaries.
      # ------------------------------------------------------------------
      - name: Assemble toolbox tree
        shell: bash
        run: |
          set -e
          ROOT="toolbox-root/toolbox"
          mkdir -p "$ROOT/bin" "$ROOT/lib/node_modules"
          # opencode bundle + metadata
          cp opencode.bundle.js "$ROOT/lib/opencode.bundle.js"
          cp opencode-src/package.json "$ROOT/lib/package.json"
          # curated node_modules
          cp -r toolbox-staging/lib/node_modules/. "$ROOT/lib/node_modules/"
          # modules.json + version.txt at toolbox root (the bridge reads them)
          cp toolbox-staging/lib/../modules.json "$ROOT/modules.json" 2>/dev/null || \
            cp toolbox-staging/modules.json "$ROOT/modules.json"
          # agent-browser JS shim (always present — delegates to the npm pkg
          # when no native binary is available for the ABI).
          cat > "$ROOT/bin/agent-browser-js" <<'EOF'
          #!/usr/bin/env node
          // Fallback shim: routes to the bundled agent-browser npm package.
          require('agent-browser/bin/agent-browser.js');
          EOF
          chmod +x "$ROOT/bin/agent-browser-js"
          # per-ABI node binaries (whatever was fetched)
          found_node=0
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for src in "node-mobile/${abi}/node" "node-mobile/node-${abi}" \
                       "node-mobile/libnode-${abi}.so"; do
              if [ -f "$src" ]; then
                cp "$src" "$ROOT/bin/node-$abi"
                chmod +x "$ROOT/bin/node-$abi"
                found_node=$((found_node+1))
                echo "Staged node for ${abi} (from $src)"
                break
              fi
            done
          done
          if [ "$found_node" -eq 0 ]; then
            echo "::warning::No per-ABI node binary staged. A maintainer must drop node-<abi> into assets/toolbox/bin/ (or libnode.so into jniLibs/<abi>/) before on-device builds will run."
          fi
          # per-ABI agent-browser binaries (whatever was fetched)
          found_ab=0
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for src in "agent-browser-mobile/${abi}/agent-browser" \
                       "agent-browser-mobile/agent-browser-${abi}"; do
              if [ -f "$src" ]; then
                cp "$src" "$ROOT/bin/agent-browser-$abi"
                chmod +x "$ROOT/bin/agent-browser-$abi"
                found_ab=$((found_ab+1))
                echo "Staged agent-browser for ${abi} (from $src)"
                break
              fi
            done
          done
          if [ "$found_ab" -eq 0 ]; then
            echo "::warning::No per-ABI agent-browser binary staged. The JS shim (bin/agent-browser-js) will be used instead."
          fi
          # version.txt = opencode-<sha> + toolbox-<sha>
          ocode_sha="$(cat opencode-version.txt)"
          printf '%s+toolbox-%s\n' "$ocode_sha" "${GITHUB_SHA::7}" > "$ROOT/version.txt"
          echo "toolbox version: $(cat "$ROOT/version.txt")"

      - name: Create toolbox.tar.gz
        shell: bash
        run: |
          tar -czf toolbox.tar.gz -C toolbox-root toolbox
          ls -lh toolbox.tar.gz

      - name: Stage final artifact layout
        shell: bash
        run: |
          mkdir -p staging/assets/toolbox staging/jniLibs
          cp toolbox.tar.gz staging/assets/toolbox/toolbox.tar.gz
          # The bridge reads version.txt + modules.json from assets/toolbox/
          # directly (without unpacking the tar) so the Dart side can show
          # the manifest + version before the runtime is started.
          tar -xzf toolbox.tar.gz -C /tmp/tb-extract
          cp /tmp/tb-extract/toolbox/version.txt staging/assets/toolbox/version.txt
          cp /tmp/tb-extract/toolbox/modules.json staging/assets/toolbox/modules.json
          # Stage any libnode.so per ABI (for the nativeLibraryDir path).
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for src in "node-mobile/${abi}/libnode.so" "node-mobile/libnode-${abi}.so"; do
              if [ -f "$src" ]; then
                mkdir -p "staging/jniLibs/${abi}"
                cp "$src" "staging/jniLibs/${abi}/libnode.so"
                break
              fi
            done
          done

      - name: Upload oagents-toolbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: oagents-toolbox
          path: staging/
          if-no-files-found: error
          retention-days: 30
