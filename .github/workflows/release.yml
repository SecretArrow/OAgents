name: Release

# On tag v*: download the latest successful main-branch `oagents-toolbox`
# artifact (produced by bundle-opencode.yml on every push to main — the
# embedded Node + opencode toolbox is a build-time asset independent of the
# app version), stage it into the Android app, build signed split-per-ABI
# release APKs and publish them to a GitHub Release.
#
# Why download instead of a reusable-workflow call (`uses:
# ./.github/workflows/bundle-opencode.yml`)? That call never fired on
# tag-triggered runs in this repo (zero workflow_call-event runs were ever
# created), so the release job was always skipped. Downloading the artifact
# from the latest green main-branch bundle run is robust + faster (no
# rebuild of the ~5-min opencode+node_modules+Termux bundle per release).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight release on a tag.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # publish the GitHub Release + APK assets
      actions: read     # query + download the bundle workflow's artifact
    steps:
      - name: Checkout OAgents
        uses: actions/checkout@v4

      - name: Find latest successful bundle run on main
        # bundle-opencode.yml runs on every push to main and uploads the
        # `oagents-toolbox` artifact. Pick the most recent SUCCESSFUL one so
        # the release always uses a known-good toolbox. If none exists yet,
        # fail loudly with a clear message.
        id: bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list -R "${{ github.repository }}" \
            -w "Bundle opencode + Node toolbox" -b main \
            -s success -L 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful 'Bundle opencode + Node toolbox' run found on main. Push a commit to main first so the oagents-toolbox artifact is produced, then re-tag."
            exit 1
          fi
          echo "Latest green bundle run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download oagents-toolbox artifact (from that bundle run)
        uses: actions/download-artifact@v4
        with:
          name: oagents-toolbox
          run-id: ${{ steps.bundle.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: oagents-toolbox

      - name: Stage embedded toolbox assets
        # The bundle workflow stages:
        #   oagents-toolbox/assets/toolbox/toolbox.tar.gz  (full Node toolbox:
        #     opencode bundle + curated node_modules + per-ABI node-<abi>
        #     binaries + per-ABI companion .so libs under lib/<abi>/ +
        #     npm/npx shims + modules.json + version.txt)
        #   oagents-toolbox/assets/toolbox/version.txt     (read by Dart pre-start)
        #   oagents-toolbox/assets/toolbox/modules.json    (read by Dart pre-start)
        # These land under android/app/src/main/assets/toolbox/ so the Kotlin
        # bridge (extracts the tar to filesDir/toolbox/ at first launch) and
        # the Dart toolbox_manifest loader (reads modules.json/version.txt via
        # rootBundle before the runtime starts) can both reach them. There is
        # NO jniLibs/libnode.so path any more — node is a real Termux-built
        # executable shipped inside the tar, exec'd from filesDir.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/toolbox
          cp oagents-toolbox/assets/toolbox/toolbox.tar.gz android/app/src/main/assets/toolbox/
          cp oagents-toolbox/assets/toolbox/version.txt    android/app/src/main/assets/toolbox/
          cp oagents-toolbox/assets/toolbox/modules.json   android/app/src/main/assets/toolbox/
          # v1.0.7 — W^X fix: copy the per-ABI jniLibs staged by the bundle
          # workflow (libnode-<abi>.so, libagentbrowser-<abi>.so and node's
          # companion lib*.so) so AGP packages them into lib/<abi>/ of the
          # split APKs. useLegacyPackaging=true extracts them at install
          # time into nativeLibraryDir, the only directory Android 10+
          # allows apps (targetSdk >= 29) to exec from.
          if [ -d oagents-toolbox/jniLibs ]; then
            mkdir -p android/app/src/main/jniLibs
            cp -r oagents-toolbox/jniLibs/. android/app/src/main/jniLibs/
            echo "jniLibs staged:"
            find android/app/src/main/jniLibs -type f -printf '  %p (%s bytes)\n' | sort
          else
            echo "::warning::oagents-toolbox/jniLibs missing — node will fall back to the filesDir copy (fails on Android 10+)."
          fi
          # Also overwrite the Dart-side placeholders (pubspec declares
          # assets/toolbox/{modules.json,version.txt} — lib/services/
          # toolbox_manifest.dart reads them via rootBundle, and rootBundle
          # never sees the android/app/src/main/assets copies). Without this
          # the release APK would ship the committed placeholder manifest and
          # the toolbox UI would show isPresent=false / an empty module list.
          cp oagents-toolbox/assets/toolbox/version.txt  assets/toolbox/version.txt
          cp oagents-toolbox/assets/toolbox/modules.json assets/toolbox/modules.json
          ls -lh android/app/src/main/assets/toolbox/ assets/toolbox/

      - name: Set up Java 17 (LTS for Android/Gradle)
        # The ubuntu-26.04 runner defaults to Java 25, which Gradle 8.x can't
        # use ("Java 25.0.5 incompatible with Gradle 8.14.3; need 9.1.0+").
        # Pin Java 17 LTS — AGP 8.x requires 17+, and Gradle 8.14.3 supports
        # 17-24. Flutter/Gradle pick this up via JAVA_HOME.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable, SDK + pub + gradle cached)
        # Use `channel: stable` (NOT `flutter-version: stable` — that input
        # expects a concrete version like 3.24.0 and misparses "stable" as a
        # version, erroring with "Unable to determine Flutter version for
        # channel: stable version: stable"). subosito/flutter-action@v2 is the
        # current major (no v3 tag exists).
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-path-builder: true

      - name: Cache pub-cache and .dart_tool
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-darttool-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-darttool-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Patch plugin proguard files for AGP 9
        # AGP 9 removed `getDefaultProguardFile('proguard-android.txt')` — it
        # bundles -dontoptimize which blocks R8 optimizations; only
        # proguard-android-optimize.txt is supported now. Several third-party
        # Flutter plugins (e.g. flutter_inappwebview_android 1.1.3) still
        # reference the deprecated file + fail at evaluation:
        #   "getDefaultProguardFile('proguard-android.txt') is no longer supported"
        # Rewrite those references in every plugin's android/build.gradle in
        # the pub-cache (populated by `flutter pub get` above) before building.
        # CI workaround until every plugin ships an AGP-9-compatible release;
        # the substitution is exact (proguard-android-optimize.txt does NOT
        # contain the substring proguard-android.txt, so already-correct files
        # are untouched).
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do
            sed -i 's|proguard-android\.txt|proguard-android-optimize.txt|g' "$f"
            echo "  patched: $f"
            count=$((count+1))
          done < <(grep -rl "proguard-android\.txt" "$HOME/.pub-cache/hosted/pub.dev"/*/android/build.gradle 2>/dev/null || true)
          echo "patched $count plugin build.gradle file(s) for AGP 9 proguard compatibility"

      - name: Decode signing keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/oagents.keystore"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; building an UNSIGNED release APK so the first release can still ship. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to ship signed releases."
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write key.properties (when keystore present)
        # ASSUMPTION: android/app/build.gradle.kts follows the standard Flutter
        # signing template (reads android/key.properties when present). If it does
        # not, the post-build apksigner step below still signs the APKs.
        if: steps.keystore.outputs.have_keystore == 'true'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=$GITHUB_WORKSPACE/oagents.keystore
          EOF

      - name: Build SIGNED release APKs (split per ABI)
        # build.gradle.kts release signingConfig reads these env vars:
        #   KEYSTORE_PATH, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_PASSWORD,
        #   KEYSTORE_ALIAS. ZAGENTS_REQUIRE_SIGNING=true makes the build FAIL
        #   if signing is misconfigured (a debug-signed release is worse than
        #   no release). The per-ABI APKs land in
        #   build/app/outputs/flutter-apk/*-{arm64-v8a,armeabi-v7a,x86_64}-release.apk
        #   already release-signed; the apksigner step below re-verifies.
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/oagents.keystore
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZAGENTS_REQUIRE_SIGNING: ${{ steps.keystore.outputs.have_keystore }}
        run: flutter build apk --release --split-per-abi

      - name: Sign APKs with apksigner (when keystore present)
        if: steps.keystore.outputs.have_keystore == 'true'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Signing $apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$GITHUB_WORKSPACE/oagents.keystore" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              "$apk"
            "$BUILD_TOOLS/apksigner" verify "$apk"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          # Uses the workflow's GITHUB_TOKEN (permissions: contents: write
          # on this job). No extra secret needed.
          token: ${{ secrets.GITHUB_TOKEN }}
