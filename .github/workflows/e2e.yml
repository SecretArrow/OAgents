name: E2E

# Integration tests against an in-process mock opencode server (no external service).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable, SDK + pub + gradle cached)
        uses: subosito/flutter-action@v2
        with:
          # channel: stable — NOT flutter-version: stable (the version
          # input expects a concrete version like 3.50.0 and misparses
          # 'stable', erroring with 'Unable to determine Flutter version')
          channel: stable
          cache: true
          cache-path-builder: true

      - name: Cache pub-cache and .dart_tool
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-darttool-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-darttool-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run e2e tests
        # Host-runnable hermetic suite (mock opencode server in-process, no
        # device/emulator needed). Lives under test/e2e/ because plain
        # `flutter test integration_test/` requires a connected device, which
        # CI runners don't have.
        run: flutter test test/e2e/
